name: Flujos E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: inventory-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sunat-fiscal-integration:
    name: SUNAT Fase 2B — consulta fiscal aislada real
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar CLI Supabase versionada
        run: npm ci
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Exponer CLI Supabase instalada desde el lockfile
        run: echo "$GITHUB_WORKSPACE/backend/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verificar runner GitHub-hosted y versiones locales
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$CI" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test "$(supabase --version)" = "2.115.0"
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = "unix:///var/run/docker.sock"
          docker info --format '{{.ServerVersion}}'

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Validar protecciones del runner fiscal
        run: node --test scripts/lib/check-fiscal-integration-environment.mjs
        working-directory: frontend

      - name: Ejecutar migraciones actuales y consulta fiscal real con Playwright
        run: node scripts/test-fiscal-sandbox-integration.mjs
        working-directory: frontend

  sunat-transactional:
    name: SUNAT Fase 2A — compilación transaccional y rollback real
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar CLI versionada
        run: npm ci
        working-directory: backend

      - name: Validar contrato del runner sin conexiones
        run: python -B -m unittest discover -s backend/scripts -p test_sunat_phase2a_runner.py -v

      - name: Iniciar proyecto efímero con el historial previo a las migraciones fiscales
        run: python -B backend/scripts/sunat_phase2a_ci.py prepare

      - name: Compilar candidatas y demostrar rollback integral
        run: python -B backend/scripts/test-sunat-phase2a.py --ci-transactional

      - name: Detener únicamente el proyecto efímero verificado
        if: always()
        run: python -B backend/scripts/sunat_phase2a_ci.py stop

  playwright:
    name: Inventario y Reparaciones E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Auditar dependencias backend de runtime
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Auditar dependencias de runtime
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend

      - name: Iniciar Supabase local
        run: npm run db:start
        working-directory: backend

      - name: Reconstruir base de pruebas
        run: npm run db:reset -- --yes
        working-directory: backend

      - name: Validar esquema y pruebas de base de datos
        run: npm run db:lint && npm run test:db
        working-directory: backend

      - name: Validar Edge Functions y scripts
        run: npm run test:functions && npm run typecheck:scripts
        working-directory: backend

      - name: Configurar frontend local
        run: npm run env:frontend
        working-directory: backend

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Validar frontend
        run: npm run test -- --run && npm run lint -- --deny-warnings && npm run build
        working-directory: frontend

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e:typecheck && npm run test:e2e:local
        working-directory: frontend

      - name: Conservar diagnóstico de fallos E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Detener Supabase local
        if: always()
        run: npm run db:stop -- --no-backup
        working-directory: backend
